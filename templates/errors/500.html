{% extends "base.html" %}
{% block title %}System Error (500){% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="stat-icon-3d stat-icon-rose mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
        <i class="bi bi-exclamation-octagon"></i>
    </div>
    <h2 class="fw-bold text-dark">Internal Server Error</h2>
    <p class="text-muted">An error occurred while processing your request. The database transaction has been safely rolled back.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn-3d btn-3d-primary mt-3">
        <i class="bi bi-arrow-clockwise"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
